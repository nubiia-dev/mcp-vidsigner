name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  ci:
    name: Lint + Typecheck + Build + Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # No VIDSIGNER_SPEC_DIR here: the suite runs on the versioned artifacts only. The tests that
      # compare against the Validated ID OpenAPI/manual are skipped (see CONTRIBUTING.md).
      - name: Test
        run: npm test

      - name: Check the package contents and server.json
        if: matrix.node-version == 22
        run: npm run check:package

      - name: Security audit (production dependencies)
        if: matrix.node-version == 22
        run: npm audit --omit=dev --audit-level=high
