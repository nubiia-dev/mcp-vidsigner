name: Publish

# Runs when a version tag (v*) is pushed. Publishes to npm (with provenance) and then to the MCP
# Registry. Before tagging: bump "version" in package.json and server.json, update CHANGELOG.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Validate + Publish to npm + MCP Registry
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # npm provenance and MCP Registry OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Provenance / Trusted Publishing need npm >= 11.5.1; Node 22 may ship an older npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json and server.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Check the package contents and server.json
        run: npm run check:package

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # NPM_TOKEN is only needed for the very first publish of the package. Once the package has
      # a Trusted Publisher configured on npmjs.com (repository nubiia-dev/mcp-vidsigner,
      # workflow publish.yml), delete the secret and this step authenticates through OIDC.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm takes a few seconds to serve a freshly published version and the MCP Registry
      # validates the package against npm: without this wait the publish can fail with
      # "version not found".
      - name: Wait for the version to be visible on npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG@$VERSION is available on npm"
              exit 0
            fi
            echo "Waiting for $PKG@$VERSION on npm ($i/30)..."
            sleep 10
          done
          echo "::error::$PKG@$VERSION did not appear on npm after 5 minutes"
          exit 1

      - name: Download MCP Publisher
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Authenticate with MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
