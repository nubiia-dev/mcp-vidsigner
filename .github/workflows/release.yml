name: Release

# Runs on every push to main (merging development into main). semantic-release reads the
# conventional commits since the last v* tag and, only if there is a releasable change (feat, fix,
# perf or a breaking change), computes the version, updates CHANGELOG.md, package.json,
# package-lock.json and server.json, publishes to npm, creates the tag and the GitHub release and,
# finally, publishes to the MCP Registry.
on:
  push:
    branches: [main]

# One release at a time; a run in progress is never cancelled (it could leave a half-published release).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    env:
      # semantic-release commits the release files itself: do not run the lint-staged hook on them.
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) and provenance need npm >= 11.5.1; Node 22 ships an older npm.
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check the package contents and server.json
        run: npm run check:package

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is only needed for the very first publish of the package: Trusted Publishing
          # can only be configured on npmjs.com once the package exists. After the first release,
          # configure the Trusted Publisher (nubiia-dev/mcp-vidsigner, workflow release.yml), delete
          # the NPM_TOKEN secret and remove the NODE_AUTH_TOKEN line below: @semantic-release/npm
          # then exchanges the job's OIDC identity (id-token: write) for a short-lived publish
          # credential. Provenance stays enabled in both cases.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release

      # semantic-release creates the tag with GITHUB_TOKEN, and GitHub does not trigger workflows
      # from events generated by its own token: publish-mcp.yml would never start by itself. That is
      # why the MCP Registry publish is chained here, only when this run released something.
      # npm takes a few seconds to serve a freshly published version and the MCP Registry validates
      # the package against npm: without this wait the publish can fail with "version not found".
      - name: Wait for the version to be visible on npm
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          for i in $(seq 1 30); do
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG@$VERSION is available on npm"
              exit 0
            fi
            echo "Waiting for $PKG@$VERSION on npm ($i/30)..."
            sleep 10
          done
          echo "::error::$PKG@$VERSION did not appear on npm after 5 minutes"
          exit 1

      - name: Download MCP Publisher
        if: steps.release.outputs.released == 'true'
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Authenticate with MCP Registry (OIDC)
        if: steps.release.outputs.released == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.release.outputs.released == 'true'
        run: ./mcp-publisher publish
